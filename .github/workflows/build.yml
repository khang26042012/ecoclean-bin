name: Build 32-bit esptool for Win32

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
      - name: Checkout esptool v4.5.1
        uses: actions/checkout@v4
        with:
          repository: espressif/esptool
          ref: v4.5.1
          path: esptool_src

      - name: Setup Python 3.10 32-bit (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x86'

      - name: Verify Python Architecture
        run: |
          python -c "import struct; bits = struct.calcsize('P') * 8; print(f'Target Python Architecture: {bits}-bit'); assert bits == 32"

      - name: Build native 32-bit esptool.exe
        working-directory: esptool_src
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install .
          pyinstaller --onefile --clean esptool.py
          ls dist/

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: ecoclean_repo

      - name: Copy 32-bit esptool to repo
        run: |
          copy esptool_src\dist\esptool.exe ecoclean_repo\esptool.exe
          cd ecoclean_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add esptool.exe
          git diff --staged --quiet || (git commit -m "Add native 32-bit esptool.exe for Windows 32-bit" && git push)
