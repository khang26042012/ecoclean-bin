name: Compile Cool Firmware for Web OTA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Platform 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile Cooling Sketch for ESP32-C3
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashMode=dio,FlashFreq=40 --output-dir ./build ./ota_minimal
          ls -la ./build
          cp build/ota_minimal.ino.bin firmware_app.bin
          ls -lh firmware_app.bin

      - name: Commit and Push firmware_app.bin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware_app.bin
          git diff --staged --quiet || (git commit -m "Auto-build firmware_app.bin for OTA" && git push)
