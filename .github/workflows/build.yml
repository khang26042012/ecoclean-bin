name: Compile ESP32 DevKit V1 OTA Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Platform 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile Sketch for ESP32 DevKit V1
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build ./ota_minimal
          ls -la ./build
          cp build/ota_minimal.ino.bin firmware_app.bin
          ls -lh firmware_app.bin

      - name: Create Merged Binary (0x0 Flashable)
        run: |
          python3 -m pip install esptool
          BOOT_APP0=$(find ~/.arduino15/packages/esp32/ -name "boot_app0.bin" | head -n 1)
          echo "Found boot_app0 at: $BOOT_APP0"
          python3 -m esptool --chip esp32 merge_bin -o firmware_merged.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 build/ota_minimal.ino.bootloader.bin 0x8000 build/ota_minimal.ino.partitions.bin 0xe000 "$BOOT_APP0" 0x10000 build/ota_minimal.ino.bin
          ls -lh firmware_merged.bin

      - name: Commit and Push binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware_app.bin firmware_merged.bin
          git diff --staged --quiet || (git commit -m "Auto-build ESP32 DevKit V1 OTA firmware" && git push)
